---
services:
  db:
    image: rakeshdornala/flm-oct:pydb
    ports:
      - "3306:3306"
    volumes:
      - mydata:/var/lib/mysql/
    networks:
      - app
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  auth_service:
    image: rakeshdornala/flm-oct:pyauth
    ports:
      - "5001:5001"
    networks:
      - app
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  book_service:
    image: rakeshdornala/flm-oct:pybook
    ports:
      - "5002:5002"
    networks:
      - app
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  borrow_service:
    image: rakeshdornala/flm-oct:pyborrow
    ports:
      - "5003:5003"
    networks:
      - app
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  frontend:
    image: rakeshdornala/flm-oct:pyfrontend
    ports:
      - "5000:5000"
    networks:
      - app
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M


networks:
  app:
    driver: overlay
    attachable: true
volumes:
  mydata:
