---
services:
  db:
    container_name: db
    build: ./database/
    ports:
      - "3306:3306"
    volumes:
      - mydata:/var/lib/mysql/
    networks:
      - app
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  auth_service:
    container_name: auth_service
    build: ./auth/
    ports:
      - "5001:5001"
    networks:
      - app
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  book_service:
    container_name: book_service
    build: ./book/
    ports:
      - "5002:5002"
    networks:
      - app
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  borrow_service:
    container_name: borrow_service
    build: ./borrow/
    ports:
      - "5003:5003"
    networks:
      - app
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  frontend:
    container_name: frontend_service
    build: ./
    ports:
      - "5000:5000"
    networks:
      - app
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M


networks:
  app:
    driver: bridge
volumes:
  mydata:
